[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrade"
version = "0.1.0"
description = "株式デイトレ自動売買 — 共通ロジック層（Backtrader / NautilusTrader 二重検証）"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
